const heading=(title,desc)=>`<div class="heading"><div><div class="eyebrow">DATTA ENTERPRISES / CONTROL ROOM</div><h1>${title}</h1><p>${desc}</p></div><span class="date-tag">◷ ${+f.year===2026?'JAN — SEP 2026':f.year+' · FULL YEAR'}</span></div>`;

const kpi=(label,value,note,dark=false)=>`<div class="card kpi ${dark?'dark':''}"><small>${label}</small><strong>${value}</strong><em>${note}</em></div>`;
const panel=(title,sub,body,extra='')=>`<article class="card ${extra}"><div class="panel-head"><div><h2>${title}</h2><span class="sub">${sub}</span></div></div>${body}</article>`;
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}">No records for these filters.</td></tr>`}</tbody></table></div>`;}
function badge(s){return `<span class="badge ${/Low|Due|Pending|Critical|Recently/.test(s)?'amber':/Out/.test(s)?'red':''}">${s}</span>`}
function group(m,key){const g={};for(const r of m.rows){const name=key==='product'?products[r.product].name:key==='category'?products[r.product].category:key==='customer'?customers[r.customer].name:r[key];const ret=m.rs.filter(a=>a.sale===r.id).reduce((s,a)=>s+a.qty,0);g[name]=(g[name]||0)+(r.qty-ret)*r.price;}return Object.entries(g).sort((a,b)=>b[1]-a[1]);}
const bars=(entries)=>{const max=Math.max(...entries.map(e=>e[1]),1);return entries.map(([name,value])=>`<div class="bar-row"><span title="${name}">${name.length>23?name.slice(0,22)+'…':name}</span><div class="track"><div class="fill" style="width:${Math.max(0,value/max*100)}%"></div></div><b>${money(value)}</b></div>`).join('')};
function monthly(){return months.slice(0,+f.year===2026?9:12).map((label,i)=>({label,...metrics({...f,month:i+1})}));}
function chart(series,keys=['revenue'],colors=['#dba66f','#426c66']){const max=Math.max(...series.flatMap(v=>keys.map(k=>v[k])),1)*1.15,W=640,H=210,base=177,left=49,space=(W-left)/series.length;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${keys.join(' versus ')} by period">${[0,1,2,3].map(i=>`<line class="gridline" x1="${left}" y1="${base-i*50}" x2="635" y2="${base-i*50}"/><text x="0" y="${base-i*50+4}">${money(max*i*50/157)}</text>`).join('')}${series.map((v,i)=>`${keys.map((k,j)=>`<rect class="chart-bar" x="${left+i*space+space*.16+j*space*.29}" y="${base-Math.max(0,v[k])/max*157}" width="${space*(keys.length>1?.27:.52)}" height="${Math.max(0,v[k])/max*157}" fill="${colors[j]}" rx="3"><title>${v.label} · ${k}: ${exact(v[k])}</title></rect>`).join('')}<text x="${left+i*space+space*.45}" y="201" text-anchor="middle">${v.label}</text>`).join('')}</svg>`;}
function lineChart(series,key){let max=Math.max(...series.map(r=>r[key]),1),min=Math.min(...series.map(r=>r[key]),0);const pts=series.map((r,i)=>[45+i*570/Math.max(1,series.length-1),175-(r[key]-min)/(max-min||1)*145]);return `<svg class="chart" viewBox="0 0 640 210"><path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#4d7b70" stroke-width="3"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#d99c5a"><title>${series[i].label}: ${key==='orders'?num(series[i][key]):money(series[i][key])}</title></circle><text x="${p[0]}" y="200" text-anchor="middle">${series[i].label}</text>`).join('')}</svg>`;}
function indiaMap(){const coords={Delhi:[155,137],Haryana:[140,124],'Uttar Pradesh':[209,163],Rajasthan:[113,181],Punjab:[128,99],Maharashtra:[132,291]};return `<svg class="map" viewBox="0 0 420 470" role="img" aria-label="India sales coverage map"><path d="M145 20 168 32 178 53 200 63 191 85 218 105 231 132 268 159 306 161 327 143 346 143 367 125 390 130 378 155 357 169 345 201 330 192 326 173 299 191 281 193 263 220 246 224 232 255 218 281 202 305 190 346 174 381 153 425 137 415 124 379 113 351 99 310 85 286 75 255 51 242 32 223 44 209 64 207 56 185 68 159 87 142 94 115 112 96 113 71 132 61 128 42 Z"/><path d="M64 207 103 225 142 205 155 163 113 145 M103 225 102 268 158 280 201 256 M155 163 202 169 243 201 M142 205 181 225 201 256 M158 280 163 334 190 346 M102 268 99 310 M163 334 124 379" fill="none"/>${Object.entries(coords).map(([name,[x,y]])=>`<g class="pin ${mapState===name?'selected':''}" data-state="${name}" tabindex="0" role="button" aria-label="Show ${name} sales"><circle cx="${x}" cy="${y}" r="6"/><text x="${x+12}" y="${y+4}">${name==='Delhi'?'Delhi · HQ':name}</text></g>`).join('')}<text x="260" y="340" style="font-size:10px;fill:#a5afa7">BAY OF BENGAL</text><text x="20" y="350" style="font-size:10px;fill:#a5afa7">ARABIAN SEA</text></svg><div class="map-note">Schematic India coverage map · boundaries illustrative · sales presence ≠ branches</div>`;}
function overview(){const m=metrics(f),prev=metrics({...f,year:+f.year-1,throughMonth:+f.year===2026?9:12}),st=stock(f),growth=prev.revenue?(m.revenue/prev.revenue-1)*100:0,ach=m.revenue/config.target*100;return heading('Business at a glance','Company ka hisaab bhi. Lafde ka hisaab bhi.')+`<div class="grid kpis">${kpi('TOTAL REVENUE',money(m.revenue),`↗ ${pct(growth)} vs prior-year selected period`,true)}${kpi('NET PROFIT',money(m.profit),`${pct(m.margin)} net profit margin`)}${kpi('TOTAL EXPENSES',money(m.total),'Cost of sales + operating costs + tax')}${kpi('TOTAL ORDERS',num(m.orders),'Wholesale orders · net sales excl. GST')}</div><div class="grid columns">${panel('Revenue performance','Monthly sales · hover over bars for exact values',chart(monthly())+`<div class="legend"><span><i class="dot"></i>Net revenue</span><span>Returns deducted · GST excluded</span></div>`)}${panel('The ₹25 crore ambition','2026 full-year turnover target',`<div class="target-ring" style="--pct:${Math.min(100,ach)}%"><div><b>${pct(ach)}</b><small>OF ANNUAL TARGET</small></div></div><div class="target-bottom"><span>Selected revenue<b>${money(m.revenue)}</b></span><span>2026 sales target<b>₹25.00 Cr</b></span></div><p class="sub">${+f.year===2026?'YTD actual versus full-year target':'Historical sales shown against the 2026 ambition'}. Target is revenue, not profit.</p>`)}</div><div class="grid three">${panel('Revenue by category','Three essentials. One dependable supplier.',bars(group(m,'category'))+`<div class="mini-metrics"><div><b>24</b><small>PRODUCT SKUs</small></div><div><b>${m.customers}</b><small>ACTIVE CUSTOMERS</small></div></div>`)}${panel('Our business footprint','Delhi roots. Growing reach.',bars(group(m,'state').slice(0,5))+`<button class="btn" data-page="India Map">Explore India map ↗</button>`)}${panel('Where the money goes','Every rupee accounted for.',bars([['Cost of goods',m.cogs],['People & payroll',m.salary],['Operations',m.other],['Tax provision',m.tax],['Net profit',m.profit]])+`<button class="btn" data-page="Finance">View financial breakdown ↗</button>`)}</div><div class="insight"><b>◈ ON THE RADAR</b><span>${st.filter(p=>p.closing<p.reorder).length} products need replenishment. Inventory worth <b>${money(st.reduce((a,p)=>a+p.closing*p.cost,0))}</b> is on hand.</span><button class="btn" data-page="Inventory">Review inventory →</button></div><div class="grid three">${panel('Top performers','Based on current filters',`<p class="sub">TOP PRODUCT</p><h3>${group(m,'product')[0]?.[0]||'—'}</h3><p class="sub">TOP CUSTOMER</p><h3>${group(m,'customer')[0]?.[0]||'—'}</h3>`)}${panel('The people behind the numbers','15 people. One Datta Enterprises.',`<div class="mini-metrics"><div><b>15</b><small>TEAM MEMBERS</small></div><div><b>${money(m.salary)}</b><small>PERIOD PAYROLL</small></div></div><p class="sub">Naresh Swaroop · Recently Joined</p><button class="btn" data-page="Employees">Meet the team →</button>`)}${panel('A different kind of ledger','DDD INVESTIGATION FILE 01',`<h3>The Sunday Ledger</h3><p class="sub">20 transactions. One pattern. ₹1,98,400.</p><button class="btn" data-page="DDD Case Files">Open case files →</button>`)}</div>`;}
function salesPage(){const m=metrics(f),p=metrics({...f,year:+f.year-1,throughMonth:+f.year===2026?9:12});return heading('Sales intelligence','From the first order to the repeat customer.')+`<div class="grid kpis">${kpi('NET SALES',money(m.revenue),'Same revenue as Overview',true)}${kpi('AVERAGE ORDER VALUE',money(m.orders?m.revenue/m.orders:0),num(m.orders)+' total orders')}${kpi('SALES GROWTH',p.revenue?pct((m.revenue/p.revenue-1)*100):'—','Prior-year selected period')}${kpi('GROSS SALES MARGIN',pct(m.revenue?(m.revenue-m.cogs)/m.revenue*100:0),'Before operating expenses')}</div><div class="grid columns">${panel('Monthly sales','Selected product, geography and customer',chart(monthly()))}${panel('Quarterly sales','Quarter selection applied',bars([1,2,3,4].map(q=>['Q'+q,metrics({...f,quarter:q}).revenue])))}</div><div class="grid three">${panel('Top 5 products','Net sales',bars(group(m,'product').slice(0,5)))}${panel('Bottom 5 products','Net sales',bars(group(m,'product').slice(-5).reverse()))}${panel('Top states','Net sales',bars(group(m,'state')))}</div><div class="grid columns">${panel('Customer ledger','Outstanding balance is a demo assumption: 12% of net sales',table(['Customer','Type','Revenue','Orders','Avg. order','Outstanding'],customers.filter(c=>m.rows.some(r=>r.customer===c.id)).map(c=>{let r=metrics({...f,customer:String(c.id)});return [c.name,c.type,money(r.revenue),num(r.orders),money(r.revenue/(r.orders||1)),money(r.revenue*.12)]})))}${panel('Returns & order quality','Refunds already reduce net revenue',`<h1>${money(m.refund)}</h1><p>Returned units: ${num(m.rs.reduce((a,r)=>a+r.qty,0))}</p><p>Cancelled orders: ${num(m.rows.reduce((a,r)=>a+r.cancelled,0))}</p><p class="sub">Cancelled orders are excluded from sales and stock movements.</p>`)} </div><div class="grid columns">${panel('Year-wise sales','Current dimensional filters',chart([2024,2025,2026].map(y=>({label:String(y),...metrics({...f,year:y})}))))}${panel('Category-wise sales','Net revenue',bars(group(m,'category')))}</div>`;}
function waterfall(m){const rows=[['Revenue',m.revenue],['Goods',-m.cogs],['Payroll',-m.salary],['Operations',-m.other],['Losses',-m.loss],['Tax',-m.tax],['Profit',m.profit]];let running=0;return '<svg class="chart" viewBox="0 0 640 210" role="img" aria-label="Revenue to net profit waterfall">'+rows.map(([label,value],i)=>{let start=i===6?0:running;let end=i===6?value:running+value;if(i!==6)running=end;const y=175-Math.max(start,end)/Math.max(m.revenue,1)*145,h=Math.max(2,Math.abs(value)/Math.max(m.revenue,1)*145);return '<rect x="'+(30+i*87)+'" y="'+y+'" width="52" height="'+h+'" rx="3" fill="'+(value<0?'#d4a16d':'#426c66')+'"><title>'+label+': '+exact(value)+'</title></rect><text x="'+(56+i*87)+'" y="200" text-anchor="middle">'+label+'</text>'}).join('')+'</svg>';}
function finance(){const m=metrics(f),periodExpenses=expenses.filter(m.period),items=[['Net revenue',m.revenue],['Cost of goods sold',-m.cogs],['Gross profit',m.revenue-m.cogs],['Employee salary / owner remuneration',-m.salary],...Array.from(new Set(periodExpenses.map(r=>r.name))).map(name=>[name,-periodExpenses.filter(r=>r.name===name).reduce((a,r)=>a+r.amount,0)*m.share]),['Damaged returned goods',-m.loss],['Profit before tax',m.profit+m.tax],['Demo income tax provision',-m.tax],['Net profit',m.profit]];const annualPayroll=employees.reduce((a,e)=>a+e.salary,0);return heading('Money in. Money out.','A profitable business is only half the story. Cash matters too.')+`<div class="grid kpis">${kpi('NET REVENUE',money(m.revenue),'After returns · before GST',true)}${kpi('GROSS PROFIT',money(m.revenue-m.cogs),'Revenue less cost of goods sold')}${kpi('NET PROFIT',money(m.profit),pct(m.margin)+' margin after demo tax provision')}${kpi('MONTHLY TEAM PAYROLL',money(annualPayroll),'Current full-team run rate · 15 people')}</div><div class="insight"><b>ACCOUNTING NOTE</b><span>Unsold purchases remain inventory. GST is tracked separately. Dimensional filters allocate shared expenses in proportion to gross sales; this is a demo allocation.</span></div><div class="grid columns">${panel('The sales-to-profit bridge','All figures reconcile to the shared ledger',waterfall(m)+table(['Line item','Amount'],items.map(([n,v])=>[n,`<b style="color:${v<0?'#94724b':'#416c5b'}">${exact(v)}</b>`])))}${panel('Expense composition','Includes costs, losses and tax provision',bars([['Goods sold',m.cogs],['Payroll',m.salary],['Operations',m.other],['Damage loss',m.loss],['Tax provision',m.tax]])+`<hr style="border:0;border-top:1px solid #eee"><h3>Cash collection illustration</h3><p class="sub">88% collected / 12% outstanding assumption</p><h1>${money(m.revenue*.88)}</h1><p>Customer dues: <b>${money(m.revenue*.12)}</b></p><p class="sub">Collections are not net cash flow or bank balance. Opening cash, payment timing and capital movements are not modelled.</p>`)}</div><div class="grid columns">${panel('Revenue vs expenses','Amber: revenue · green: total expenses',chart(monthly(),['revenue','total']))}${panel('Profit trend','Net profit after the demo tax provision',lineChart(monthly(),'profit'))}</div><div class="grid columns">${panel('Year-on-year profit','2026 is YTD, earlier years follow selected periods',chart([2024,2025,2026].map(y=>({label:String(y),...metrics({...f,year:y})})),['profit']))}${panel('Operating profit','Before interest, depreciation and income tax',`<h1>${money(m.profit+m.tax+periodExpenses.filter(r=>r.name==='Interest & depreciation').reduce((a,r)=>a+r.amount,0)*m.share)}</h1><p class="sub">Owner remuneration is modelled as a business expense for this fictional corporate-style illustration. Provision rate is editable in data.js; it is not a legal tax determination.</p>`)}</div>`;}
function inventoryPage(){const st=stock(f),sum=k=>st.reduce((a,p)=>a+(p[k]||0),0);return heading('Stock & supply','Bought in bulk. Tracked by the unit. Ready for dispatch.')+`<div class="grid kpis">${kpi('INVENTORY VALUE',money(st.reduce((a,p)=>a+p.closing*p.cost,0)),'Closing stock at purchase cost',true)}${kpi('STOCK ON HAND',num(sum('closing')),'Bulk sale units, not individual pieces')}${kpi('LOW STOCK',num(st.filter(p=>p.closing>0&&p.closing<p.reorder).length),'Below reorder threshold')}${kpi('OUT OF STOCK',num(st.filter(p=>p.closing===0).length),'Immediate purchase attention')}</div><div class="insight"><b>STOCK SCOPE</b><span>Company stock at the selected month / quarter end. State and customer filters do not partition shared stock. Movements below are for that closing month.</span></div><div class="card" style="margin-top:17px">${table(['SKU / product','Category','Buy / sell price','Opening','Purchased','Sold','Returned','Damaged','Closing','Value','Reorder','Status'],st.map(p=>[p.sku+'<br><b>'+p.name+'</b>',p.category,exact(p.cost)+' / '+exact(p.price),p.opening,p.purchased,p.sold,p.returned,p.damaged,p.closing,money(p.closing*p.cost),p.reorder,badge(p.closing===0?'Out of Stock':p.closing<30?'Critical':p.closing<p.reorder?'Low Stock':'Healthy Stock')]))}</div><div class="grid columns">${panel('Inventory trend','Company stock value at each month end',lineChart(monthly().map((r,i)=>({...r,value:stock({...f,month:i+1}).reduce((a,p)=>a+p.closing*p.cost,0)})),'value'))}${panel('Stock reconciliation','Every stock movement is recorded',`<p>Opening + purchases − sales + returns − damaged returns = closing stock.</p><h3>${num(sum('opening'))} + ${num(sum('purchased'))} − ${num(sum('sold'))} + ${num(sum('returned'))} − ${num(sum('damaged'))} = ${num(sum('closing'))}</h3>`)}</div><div class="card" style="margin-top:17px"><h2>Supplier ledger</h2><p class="sub">Period purchases · company-wide · 15% unpaid demo assumption</p>${table(['Supplier','Category','Purchase value','Purchase batches','Pending','On-time delivery'],suppliers.map(s=>{const rows=purchases.filter(r=>r.supplier===s.id&&metrics(f).period(r));const v=rows.reduce((a,r)=>a+r.amount,0);return [s.name,s.category,money(v),rows.length,money(v*.15),s.delivery+'%']}))}</div>`;}
function team(){return heading('The people of Datta Enterprises','15 familiar faces. Every role has a story.')+`<div class="insight"><b>PAYROLL BASIS</b><span>Current salary run rates below. Finance uses period payroll, with Naresh included from March 2026 as an editable demo assumption; the story year is not confirmed.</span></div><div class="grid three">${employees.map((e,i)=>`<article class="card employee" data-employee="${i}" tabindex="0" role="button"><div style="display:flex;justify-content:space-between"><div class="avatar">${e.name.split(' ').map(n=>n[0]).slice(0,2).join('')}</div>${badge(e.status)}</div><h2>${e.name}</h2><p>${e.role}</p><div class="sub">${e.id} · ${e.department}</div><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><strong>${exact(e.salary)}</strong><span class="sub"> / month</span><p>Annual run rate: ${money(e.salary*12)}</p><span class="sub">View profile & responsibility ↗</span></article>`).join('')}</div>`;}
function mapPage(){const m=metrics({...f,state:mapState});return heading('Delhi roots. National reach.','Explore the states that keep our dispatch desk busy.')+`<div class="grid columns">${panel('India · sales footprint','Six active markets · one Delhi headquarters',indiaMap())}${panel(mapState+(mapState==='Delhi'?' · HEAD OFFICE':''),'Click a map marker or select a state below',`<select id="map-select" aria-label="Selected map state">${options(states,mapState)}</select><h1 style="margin-top:25px">${money(m.revenue)}</h1><p class="sub">NET SALES IN SELECTED PERIOD</p><div class="mini-metrics"><div><b>${num(m.orders)}</b><small>ORDERS</small></div><div><b>${m.customers}</b><small>CUSTOMERS</small></div></div><p>Products sold: <b>${num(m.qty-m.rs.reduce((a,r)=>a+r.qty,0))}</b> bulk units</p><p>Returns: <b>${money(m.refund)}</b></p><p>Allocated profit: <b>${money(m.profit)}</b></p><p class="sub">Shared costs allocated by gross revenue. Map selection overrides the global state filter. Sales coverage does not imply offices or branches.</p><div class="insight">⌖ Headquarters: Delhi, near Qutub Minar</div>`)}</div>`;}
function gst(){const base={...f,state:'',product:'',category:'',customer:''},m=metrics(base),ps=purchases.filter(m.period),out=m.revenue*config.gstDemoRate,input=ps.reduce((a,p)=>a+p.amount,0)*config.gstDemoRate,payable=Math.max(0,out-input),rows=compliance.filter(m.period);return heading('GST & compliance','A clean ledger. A clear compliance calendar.')+`<div class="insight"><b>DEMO, NOT A TAX RETURN</b><span>Editable illustrative rate: ${pct(config.gstDemoRate*100)} for all SKUs. Actual rates require HSN classification. Company-wide period figures; product, customer and state slicers are not applied.</span></div><div class="grid kpis" style="margin-top:17px">${kpi('OUTPUT GST',money(out),'Net sales × editable demo rate',true)}${kpi('INPUT GST',money(input),'Purchase ledger × demo rate')}${kpi('NET GST LIABILITY',money(payable),'Before cash payments / ledger adjustments')}${kpi('INCOME TAX PROVISION',money(m.tax),'Editable illustration, not statutory advice')}</div><div class="grid columns">${panel('Filing register','Demo statuses · dates must be verified before real use',table(['Period','GSTR-1','GSTR-3B','E-invoices','E-way bills'],rows.map(r=>[months[r.month-1]+' '+r.year,badge(r.gstr1),badge(r.gstr3b),r.einvoices,r.eway])))}${panel('How GST flows','Delhi headquarters',`<h3>Delhi → Delhi</h3><p>CGST + SGST, subject to place-of-supply rules.</p><h3>Delhi → another state</h3><p>IGST, subject to place-of-supply rules.</p><h3>Eligible input tax credit</h3><p>Offsets output tax under applicable conditions.</p><p class="sub">GST collected is not revenue. Recoverable input GST is not product cost.</p>`)}</div><div class="grid three">${panel('Government payments','Separate from profit reporting','<p>Payment ledger: not supplied</p><span class="badge amber">Pending demo configuration</span>')}${panel('TDS & outstanding dues','No unsupported tax amounts','<p>TDS: not modelled</p><p>Paid GST / overdue dues: not supplied</p>')}${panel('Upcoming deadlines','Configure verified filing calendar','<p>Next filing period: following selected month.</p><p class="sub">Exact legal deadlines intentionally not invented.</p>')}</div>`;}
function casePage(){return heading('Some numbers tell another story.','DDD CASE FILES · Separate from the company accounts.')+`<div class="grid three">${cases.map(c=>`<article class="card dossier"><div class="case-number">CASE FILE / ${String(c.number).padStart(2,'0')}</div>${badge(c.status)}<h2 style="margin-top:20px">${c.title}</h2><h1>${c.amount?exact(c.amount):'CLASSIFIED'}</h1><p class="sub">${c.pattern}</p><button data-case="${c.number}">${c.number===1?'Examine evidence':'View placeholder'} →</button></article>`).join('')}</div>`;}
function lab(){return heading('DDD Data Lab','Learn to read the business. Then learn to question it.')+`<div class="grid kpis">${dataTools.map(t=>panel(t.name,'INVESTIGATION TOOLKIT',`<p>${t.topics}</p><button class="btn" data-tool="${t.name}">Explore techniques →</button>`)).join('')}</div><div class="grid columns">${panel('Case 01 · The Sunday Ledger','Proposed learning walkthrough · Excel + SQL',`<h3>Investigation question</h3><p>Why do 20 late-night Sunday payments share the same ₹9,920 amount?</p><h3>Dataset</h3><p>Separate case payment ledger: vendor aliases, timestamps, amount, creator ID and reference suffixes.</p><h3>What was checked</h3><p>Day-of-week filtering, payment totals, repeated amounts, alias joins and GST mismatches.</p><h3>What the audience learns</h3><p>Filter first. Reconcile totals. Connect records. Treat patterns as leads, not proof of guilt.</p><button class="btn" id="run-query">Run demo SQL →</button><pre id="query-result" style="white-space:pre-wrap;font-size:12px"></pre>`)}${panel('Upcoming investigations','Cases 02–07',table(['Case','Tool','Learning objective'],cases.slice(1).map(c=>['0'+c.number,'Not assigned','Awaiting official story data']))+'<p class="sub">Power BI and Python are available learning tools, not forced into every case.</p>')}</div>`;}
function profile(){return heading('Built on trust. Since 1998.','DATTA ENTERPRISES · A Desi Data Drama company.')+`<div class="grid kpis">${kpi('ESTABLISHED','29 July 1998','Delhi, India',true)}${kpi('PEOPLE','15','Including Datta Bhaiya')}${kpi('2026 SALES TARGET','₹25 Cr','Full-year turnover ambition')}${kpi('BUSINESS MODEL','Wholesale','Distribution · B2B customers')}</div><div class="card" style="margin-top:17px"><h2>What does Datta Enterprises actually do?</h2><p>We buy everyday business essentials in bulk from suppliers, store them, and supply shops, offices, dealers and local businesses. Our earnings come from the margin on resale. Datta Enterprises is not a manufacturer.</p><div class="flow">${['Supplier','Bulk purchase','Datta inventory','Customer order','Dispatch','Business customer','Payment','Margin'].map(v=>`<span>${v}</span>`).join('')}</div></div><div class="grid three">${categories.map((c,i)=>panel(c,'OUR BUSINESS',products.filter(p=>p.category===c).slice(0,4).map(p=>`<p>${p.name.split(' · ')[0]}</p>`).join(''))).join('')}</div><div class="grid columns">${panel('One office. Many responsibilities.','Organisation · Datta Bhaiya, Owner / Managing Director',`<div class="flow">${[...new Set(employees.map(e=>e.department))].map(d=>`<span>${d}</span>`).join('')}</div>`)}${panel('Our home in the DDD universe','Company profile',`<p>Headquarters: Delhi, near Qutub Minar.</p><p>${customers.length} fictional B2B customers · ${suppliers.length} fictional suppliers.</p><p><b>Naresh Swaroop</b><br>Recently Joined Data Analyst & Investigator.</p><p class="sub">March joining is established; exact day and story year remain unconfirmed.</p><h3>DATA NIKALO. LAFDA PAKDO.</h3><p class="sub">WHERE DATA ANALYSIS MEETS DESI DRAMA</p>`)}</div>`;}
const pages={Overview:overview,Sales:salesPage,Finance:finance,Inventory:inventoryPage,Employees:team,'India Map':mapPage,'GST & Compliance':gst,'DDD Case Files':casePage,'Data Lab':lab,'Company Profile':profile};
function render(){filters();$('#content').innerHTML=pages[page]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function modal(body){$('#modal').innerHTML='<button class="close" id="close" aria-label="Close">×</button>'+body;$('#modal').showModal();}
document.addEventListener('change',e=>{if(e.target.dataset.filter){f[e.target.dataset.filter]=e.target.value;if(+f.year===2026&&+f.month>9)f.month='';if(+f.year===2026&&+f.quarter>3)f.quarter='';render();}if(e.target.id==='map-select'){mapState=e.target.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-state],[data-employee]');if(!b)return;if(b.dataset.page){page=b.dataset.page;document.body.classList.remove('menu');render();window.scrollTo(0,0);}if(b.id==='menu')document.body.classList.toggle('menu');if(b.id==='reset'){f={year:f.year,month:'',quarter:'',state:'',category:'',product:'',customer:''};render();}if(b.dataset.state){mapState=b.dataset.state;render();}if(b.id==='close')$('#modal').close();if(b.dataset.employee!==undefined){const em=employees[+b.dataset.employee];modal(`<div class="eyebrow">TEAM PROFILE · ${em.id}</div><h1>${em.name}</h1>${badge(em.status)}<h3>${em.role}</h3><p>${em.responsibility}</p><p>Department: ${em.department}</p><p>Joined: ${em.joined}</p><p>Monthly salary: ${exact(em.salary)}<br>Annual salary run rate: ${exact(em.salary*12)}</p><p class="sub">Period payroll is derived from the central salary ledger. Salary values are editable in data.js.</p>`);}if(b.dataset.case){const c=cases[+b.dataset.case-1];modal(`<div class="eyebrow">DDD / CASE ${String(c.number).padStart(2,'0')}</div><h1>${c.title}</h1>${badge(c.status)}<h2>${c.amount?exact(c.amount):'Amount not supplied'}</h2><p>${c.pattern}</p><p>Date: ${c.date}<br>Characters: ${c.characters}<br>Department: ${c.department}</p>${c.evidence.map(t=>`<div class="evidence">${t}</div>`).join('')}<p>Tools: ${c.tools.join(' · ')||'Not assigned'}</p><p><b>Hidden clue:</b> ${c.clue}</p><p class="sub">Case creator ID E002 is evidence, not a confirmed employee identity or culprit. Case amounts are excluded from normal business accounting.</p>`);}if(b.dataset.tool){const t=dataTools.find(t=>t.name===b.dataset.tool);modal(`<div class="eyebrow">DDD DATA LAB</div><h1>${t.name}</h1><p>${t.topics}</p><p>${t.name==='SQL'?'Group the payment ledger by transaction amount and weekday, then join vendor references to investigate aliases.':t.name==='Excel'?'Filter Sunday payments, sort by time, and use a pivot table to reconcile counts and amounts.':t.name==='Power BI'?'Use linked KPIs, slicers and trend charts to compare revenue, costs and performance.':'Clean inconsistent vendor labels, then flag repeated amounts and unusual transaction times.'}</p>`);}if(b.id==='run-query')$('#query-result').textContent='SELECT amount, COUNT(*) AS transactions, SUM(amount) AS total\nFROM case_01 WHERE weekday = \'Sunday\'\nGROUP BY amount;\n\namount       transactions      total\n₹9,920       20                ₹1,98,400\n\nComputed demo: '+exact(Array(20).fill(9920).reduce((a,v)=>a+v,0));if(b.id==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='datta-enterprises-central-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-state],[data-employee]')){e.preventDefault();e.target.click();}});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});render();
</script><script>if(window.self===window.top){const a=document.createElement("a");a.href="index.html#control-room";a.textContent="← Back to DDD website";a.style.cssText="display:block;padding:12px 20px;background:#142b34;color:#e5b271;text-align:center;font:12px sans-serif;text-decoration:none";document.body.append(a);}</script></body></html>
